# AQROS monorepo — workspace root.
# This root is a "virtual" project: it owns shared tooling config and the uv
# workspace definition, but is not itself a buildable package.

[project]
name = "aqros-workspace"
version = "0.0.0"
description = "AQROS — Autonomous Quant Research Operating System (monorepo root)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "backend/*"]

[tool.uv.sources]
aqros-core = { workspace = true }

# Dev tooling shared across the whole workspace (PEP 735 dependency group).
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "httpx>=0.27",
]

# ---------------------------------------------------------------------------
# Ruff — linting (formatting is delegated to Black; Ruff runs lint only).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "docs", "frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length is enforced by Black
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"] # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["aqros_core"]

# ---------------------------------------------------------------------------
# Black — formatting.
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "/(\\.venv|docs|frontend)/"

# ---------------------------------------------------------------------------
# MyPy — static typing (strict). Checks package sources only, not tests.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
pretty = true
exclude = ["tests/", "build/", "dist/"]

# ---------------------------------------------------------------------------
# Pytest.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["libs", "backend", "tests"]
consider_namespace_packages = true
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ---------------------------------------------------------------------------
# Coverage (reporting only; no gate enforced in Phase 0).
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/main.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
