[project]
name = "aqros-outbox"
version = "0.1.0"
description = "AQROS transactional outbox — guaranteed at-least-once event delivery via the outbox pattern."
requires-python = ">=3.12"
dependencies = [
    "aqros-core",
    "aqros-events",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.10,<1.0"]
dev = ["pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqros_outbox"]

[tool.uv.sources]
aqros-core = { workspace = true }
aqros-events = { workspace = true }
