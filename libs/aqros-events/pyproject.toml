[project]
name = "aqros-events"
version = "0.2.0"
description = "AQROS shared event bus library — EventBus ABC, EventEnvelope, InProcessEventBus, and KafkaEventBus adapter."
requires-python = ">=3.12"
dependencies = [
    "aqros-core",
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.10,<1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqros_events"]

[tool.uv.sources]
aqros-core = { workspace = true }
