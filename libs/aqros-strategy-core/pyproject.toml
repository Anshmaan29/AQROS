[project]
name = "aqros-strategy-core"
version = "0.1.0"
description = "AQROS shared strategy/risk/OMS contracts — the single core shared unmodified across backtest, paper, and live (CLAUDE.md §7.1)."
requires-python = ">=3.12"
dependencies = [
    "aqros-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqros_strategy_core"]

[tool.uv.sources]
aqros-core = { workspace = true }
