[project]
name = "aqros-market-data"
version = "0.1.0"
description = "AQROS market-data service — Vendor/venue feed boundary; normalize and publish ticks."
requires-python = ">=3.12"
dependencies = ["aqros-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqros_market_data"]

[tool.uv.sources]
aqros-core = { workspace = true }
