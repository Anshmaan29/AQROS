[project]
name = "aqros-market-data"
version = "0.1.0"
description = "AQROS market-data service — Vendor/venue feed boundary; normalize and publish ticks."
requires-python = ">=3.12"
dependencies = [
    "aqros-core",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "yfinance>=0.2.43",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "testcontainers[postgres]>=4.8",
    "psycopg[binary]>=3.2",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqros_market_data"]

[tool.uv.sources]
aqros-core = { workspace = true }
