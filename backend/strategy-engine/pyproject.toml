[project]
name = "aqros-strategy-engine"
version = "0.1.0"
description = "AQROS Strategy Engine — Convert model predictions into deterministic trading signals."
requires-python = ">=3.12"
dependencies = [
    "aqros-core",
    "aqros-events",
    "aqros-outbox",
    "httpx>=0.27",
    "pydantic>=2.5",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqros_strategy_engine"]

[tool.uv.sources]
aqros-core = { workspace = true }
aqros-events = { workspace = true }
aqros-outbox = { workspace = true }
