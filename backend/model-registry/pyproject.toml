[project]
name = "aqros-model-registry"
version = "0.1.0"
description = "AQROS model-registry service — Versioned, governed store of models and lineage."
requires-python = ">=3.12"
dependencies = ["aqros-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqros_model_registry"]

[tool.uv.sources]
aqros-core = { workspace = true }
