[project]
name = "aqros-auth"
version = "0.1.0"
description = "AQROS auth service — Identity (OIDC-ready), RBAC, and the four-eyes approval workflow."
requires-python = ">=3.12"
dependencies = [
    "aqros-core",
    "fastapi[standard]>=0.115.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqros_auth"]

[tool.uv.sources]
aqros-core = { workspace = true }