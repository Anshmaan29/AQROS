[project]
name = "aqros-portfolio"
version = "0.1.0"
description = "AQROS portfolio service — Positions, P&L accounting, and optimization."
requires-python = ">=3.12"
dependencies = ["aqros-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqros_portfolio"]

[tool.uv.sources]
aqros-core = { workspace = true }
