[project]
name = "aqros-feature-store"
version = "0.1.0"
description = "AQROS feature-store service — Point-in-time feature serving (offline + online)."
requires-python = ">=3.12"
dependencies = ["aqros-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqros_feature_store"]

[tool.uv.sources]
aqros-core = { workspace = true }
