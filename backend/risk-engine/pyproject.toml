[project]
name = "aqros-risk-engine"
version = "0.1.0"
description = "AQROS risk-engine service — Pre-trade checks and the sovereign hard risk kernel."
requires-python = ">=3.12"
dependencies = ["aqros-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqros_risk_engine"]

[tool.uv.sources]
aqros-core = { workspace = true }
