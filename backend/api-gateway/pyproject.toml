[project]
name = "aqros-api-gateway"
version = "0.1.0"
description = "AQROS api-gateway service — Single ingress; routing, auth handoff, rate limits."
requires-python = ">=3.12"
dependencies = ["aqros-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqros_api_gateway"]

[tool.uv.sources]
aqros-core = { workspace = true }
