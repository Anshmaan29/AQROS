[project]
name = "aqros-api-gateway"
version = "0.1.0"
description = "AQROS api-gateway service — Single ingress; routing, auth handoff, rate limits."
requires-python = ">=3.12"
dependencies = [
    "aqros-core",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=1.4.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqros_api_gateway"]

[tool.uv.sources]
aqros-core = { workspace = true }
