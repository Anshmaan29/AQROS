[project]
name = "aqros-training-pipeline"
version = "0.1.0"
description = "AQROS training-pipeline service — trains and evaluates candidate ML models on Dataset Builder-approved datasets."
requires-python = ">=3.12"
dependencies = [
    "aqros-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "joblib>=1.4",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "testcontainers[postgres]>=4.8",
    "psycopg[binary]>=3.2",
    "pandas-stubs>=2.2",
    "hypothesis>=6.112",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqros_training_pipeline"]

[tool.uv.sources]
aqros-core = { workspace = true }
