# AQROS local stack.
# Every service builds from the same parameterized Dockerfile and exposes only
# health endpoints, except market-data (Phase 1), feature-store (Phase 2), and
# dataset-builder (Phase 3), which each own their own Postgres database.
# feature-store reaches market-data, and dataset-builder reaches both
# market-data and feature-store, exclusively through their published REST
# APIs — never another service's database (CLAUDE.md §7.9). Remaining
# datastores (Redis/Kafka) are added in later phases.
#
#   docker compose build && docker compose up -d
#   curl localhost:8002/health/ready
#   curl localhost:8003/health/ready
#   curl localhost:8008/health/ready

x-service-defaults: &service-defaults
  build:
    context: .
    dockerfile: docker/Dockerfile.service
  restart: unless-stopped
  environment:
    AQROS_ENVIRONMENT: dev
    AQROS_LOG_JSON: "false"
  networks: [aqros]

services:
  api-gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: api-gateway, MODULE: aqros_api_gateway, PORT: "8000" }
    ports: ["8000:8000"]

  auth:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: auth, MODULE: aqros_auth, PORT: "8001" }
    ports: ["8001:8001"]

  market-data-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aqros
      POSTGRES_PASSWORD: aqros
      POSTGRES_DB: aqros_market_data
    ports: ["5432:5432"]
    volumes:
      - market-data-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqros -d aqros_market_data"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [aqros]

  market-data:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: market-data, MODULE: aqros_market_data, PORT: "8002" }
    ports: ["8002:8002"]
    environment:
      AQROS_ENVIRONMENT: dev
      AQROS_LOG_JSON: "false"
      AQROS_DATABASE_URL: postgresql+asyncpg://aqros:aqros@market-data-db:5432/aqros_market_data
    depends_on:
      market-data-db:
        condition: service_healthy

  feature-store-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aqros
      POSTGRES_PASSWORD: aqros
      POSTGRES_DB: aqros_feature_store
    ports: ["5433:5432"]
    volumes:
      - feature-store-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqros -d aqros_feature_store"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [aqros]

  feature-store:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: feature-store, MODULE: aqros_feature_store, PORT: "8003" }
    ports: ["8003:8003"]
    environment:
      AQROS_ENVIRONMENT: dev
      AQROS_LOG_JSON: "false"
      AQROS_DATABASE_URL: postgresql+asyncpg://aqros:aqros@feature-store-db:5432/aqros_feature_store
      # Reaches the Market Data Service only through its published REST API
      # (container DNS name + internal port) — never its database.
      AQROS_MARKET_DATA_BASE_URL: http://market-data:8002
    depends_on:
      feature-store-db:
        condition: service_healthy
      market-data:
        condition: service_started

  dataset-builder-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aqros
      POSTGRES_PASSWORD: aqros
      POSTGRES_DB: aqros_dataset_builder
    ports: ["5434:5432"]
    volumes:
      - dataset-builder-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqros -d aqros_dataset_builder"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [aqros]

  dataset-builder:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: dataset-builder, MODULE: aqros_dataset_builder, PORT: "8008" }
    ports: ["8008:8008"]
    environment:
      AQROS_ENVIRONMENT: dev
      AQROS_LOG_JSON: "false"
      AQROS_DATABASE_URL: postgresql+asyncpg://aqros:aqros@dataset-builder-db:5432/aqros_dataset_builder
      # Reaches Market Data (for labels, computed from future prices) and
      # Feature Store (for the X matrix) only through their published REST
      # APIs — never their databases.
      AQROS_MARKET_DATA_BASE_URL: http://market-data:8002
      AQROS_FEATURE_STORE_BASE_URL: http://feature-store:8003
      AQROS_DATASET_ARTIFACT_DIR: /data/dataset-builder/artifacts
    volumes:
      - dataset-builder-artifacts:/data/dataset-builder/artifacts
    depends_on:
      dataset-builder-db:
        condition: service_healthy
      market-data:
        condition: service_started
      feature-store:
        condition: service_started

  training-pipeline-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aqros
      POSTGRES_PASSWORD: aqros
      POSTGRES_DB: aqros_training_pipeline
    ports: ["5435:5432"]
    volumes:
      - training-pipeline-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqros -d aqros_training_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [aqros]

  training-pipeline:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: training-pipeline, MODULE: aqros_training_pipeline, PORT: "8009" }
    ports: ["8009:8009"]
    environment:
      AQROS_ENVIRONMENT: dev
      AQROS_LOG_JSON: "false"
      AQROS_DATABASE_URL: postgresql+asyncpg://aqros:aqros@training-pipeline-db:5432/aqros_training_pipeline
      # Reaches the Dataset Builder Service only through its published REST API
      # — never its database, and never Market Data or Feature Store at all.
      AQROS_DATASET_BUILDER_BASE_URL: http://dataset-builder:8008
      AQROS_ARTIFACT_DIR: /data/training-pipeline/artifacts
    volumes:
      - training-pipeline-artifacts:/data/training-pipeline/artifacts
    depends_on:
      training-pipeline-db:
        condition: service_healthy
      dataset-builder:
        condition: service_started

  model-registry:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: model-registry, MODULE: aqros_model_registry, PORT: "8004" }
    ports: ["8004:8004"]

  risk-engine:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: risk-engine, MODULE: aqros_risk_engine, PORT: "8005" }
    ports: ["8005:8005"]

  portfolio:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: portfolio, MODULE: aqros_portfolio, PORT: "8006" }
    ports: ["8006:8006"]

  audit-ledger:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: audit-ledger, MODULE: aqros_audit_ledger, PORT: "8007" }
    ports: ["8007:8007"]

networks:
  aqros:
    driver: bridge

volumes:
  market-data-db-data:
  feature-store-db-data:
  dataset-builder-db-data:
  dataset-builder-artifacts:
  training-pipeline-db-data:
  training-pipeline-artifacts:
